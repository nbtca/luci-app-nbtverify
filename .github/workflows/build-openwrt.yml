name: Build ImmortalWrt packages

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SDK_BASE_URL: https://downloads.immortalwrt.org/releases/25.12.1/targets/x86/64
  SDK_ARCHIVE: immortalwrt-sdk-25.12.1-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst
  SDK_SHA256: 02ad8cfc775001ccae8e9282d19696de54e3ab3963f005737ad61f8698263edd

jobs:
  build:
    name: ImmortalWrt 25.12.1 / x86_64
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential clang curl flex bison g++ gawk gcc-multilib \
            g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-setuptools rsync swig unzip zlib1g-dev \
            file wget zstd

      - name: Download and verify SDK
        run: |
          curl --fail --location --retry 3 --retry-delay 2 \
            --output "$SDK_ARCHIVE" "$SDK_BASE_URL/$SDK_ARCHIVE"
          echo "$SDK_SHA256 *$SDK_ARCHIVE" | sha256sum --check --strict
          mkdir openwrt-sdk
          tar --zstd --extract --file "$SDK_ARCHIVE" \
            --directory openwrt-sdk --strip-components=1

      - name: Cache package downloads
        uses: actions/cache@v4
        with:
          path: openwrt-sdk/dl
          key: immortalwrt-25.12.1-x86_64-${{ hashFiles('nbtverify/Makefile', 'nbtverify/patches/**') }}

      - name: Prepare feeds and packages
        run: |
          cd openwrt-sdk
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          cp -a "$GITHUB_WORKSPACE/nbtverify" package/nbtverify
          cp -a "$GITHUB_WORKSPACE/luci-app-nbtverify" package/luci-app-nbtverify

      - name: Configure SDK
        run: |
          cd openwrt-sdk
          cat > .config <<'EOF'
          CONFIG_PACKAGE_nbtverify=m
          CONFIG_PACKAGE_luci-app-nbtverify=m
          CONFIG_PACKAGE_luci-i18n-nbtverify-zh-cn=m
          EOF
          make defconfig
          for package in nbtverify luci-app-nbtverify luci-i18n-nbtverify-zh-cn; do
            grep -qx "CONFIG_PACKAGE_${package}=m" .config || {
              echo "Package was not selected: $package" >&2
              exit 1
            }
          done

      - name: Build packages
        run: |
          cd openwrt-sdk
          make package/nbtverify/download V=s
          make package/nbtverify/compile -j"$(nproc)" V=s
          make package/feeds/luci/luci-base/host/compile -j"$(nproc)" V=s
          make package/luci-app-nbtverify/compile -j"$(nproc)" V=s

      - name: Collect and verify packages
        run: |
          mkdir output
          find openwrt-sdk/bin/packages -type f \
            \( -name 'nbtverify-*.apk' \
               -o -name 'luci-app-nbtverify-*.apk' \
               -o -name 'luci-i18n-nbtverify-zh-cn-*.apk' \) \
            -exec cp --target-directory=output {} +

          for package in nbtverify luci-app-nbtverify luci-i18n-nbtverify-zh-cn; do
            find output -maxdepth 1 -type f -name "${package}-*.apk" -print -quit | grep -q . || {
              echo "Missing package: $package" >&2
              exit 1
            }
          done

          (cd output && sha256sum -- *.apk > SHA256SUMS)
          ls -lh output

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-25.12.1-x86_64-packages
          path: |
            output/*.apk
            output/SHA256SUMS
          if-no-files-found: error

  release:
    name: Create release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: immortalwrt-25.12.1-x86_64-packages
          path: release

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.apk
            release/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true
