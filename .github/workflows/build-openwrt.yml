name: Build OpenWrt Packages

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86_64
          - arch: x86_64
            sdk_url_path: snapshots/targets/x86/64
            sdk_name: openwrt-sdk-x86-64_gcc-13.3.0_musl.Linux-x86_64
          # ARM Cortex-A9
          - arch: arm_cortex-a9
            sdk_url_path: snapshots/targets/bcm53xx/generic
            sdk_name: openwrt-sdk-bcm53xx-generic_gcc-13.3.0_musl_eabi.Linux-x86_64
          # ARM Cortex-A7
          - arch: arm_cortex-a7_neon-vfpv4
            sdk_url_path: snapshots/targets/ipq40xx/generic
            sdk_name: openwrt-sdk-ipq40xx-generic_gcc-13.3.0_musl_eabi.Linux-x86_64
          # ARM64/Aarch64
          - arch: aarch64_cortex-a53
            sdk_url_path: snapshots/targets/ipq806x/generic
            sdk_name: openwrt-sdk-ipq806x-generic_gcc-13.3.0_musl.Linux-x86_64
          # MIPS
          - arch: mipsel_24kc
            sdk_url_path: snapshots/targets/ramips/mt7621
            sdk_name: openwrt-sdk-ramips-mt7621_gcc-13.3.0_musl.Linux-x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-distutils rsync unzip zlib1g-dev file wget qemu-utils

      - name: Download and extract SDK
        run: |
          wget -q https://downloads.openwrt.org/${{ matrix.sdk_url_path }}/${{ matrix.sdk_name }}.tar.xz
          tar xf ${{ matrix.sdk_name }}.tar.xz
          mv ${{ matrix.sdk_name }} openwrt-sdk

      - name: Update and install feeds
        run: |
          cd openwrt-sdk
          # Update feeds
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          
          # Install golang
          ./scripts/feeds install golang

      - name: Copy packages to SDK
        run: |
          cd openwrt-sdk
          mkdir -p package/nbtverify
          cp -r ../nbtverify/* package/nbtverify/
          mkdir -p package/luci-app-nbtverify
          cp -r ../luci-app-nbtverify/* package/luci-app-nbtverify/

      - name: Configure SDK
        run: |
          cd openwrt-sdk
          # Create minimal config
          cat > .config <<EOF
          CONFIG_PACKAGE_nbtverify=m
          CONFIG_PACKAGE_luci-app-nbtverify=m
          EOF
          make defconfig

      - name: Build packages
        run: |
          cd openwrt-sdk
          make package/nbtverify/compile V=s
          make package/luci-app-nbtverify/compile V=s

      - name: Collect packages
        run: |
          cd openwrt-sdk
          mkdir -p ../output
          find bin/packages -name '*.ipk' -exec cp {} ../output/ \;
          ls -lh ../output/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.arch }}
          path: output/*.ipk

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          find artifacts -name '*.ipk' -exec cp {} release/ \;
          ls -lh release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.ipk
          generate_release_notes: true
          draft: false
          prerelease: false
